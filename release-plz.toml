# Release automation via release-plz (https://release-plz.dev).
#
# Flow: every push to main opens/updates a release PR with version bumps and
# changelog entries; nothing is published until the maintainer merges it.
# See CONTRIBUTING.md ("Releases") for the full flow and the manual fallback.

[workspace]
semver_check = true
# The single source of truth for releases is the facade: one root
# CHANGELOG.md, one git tag (v{version}), one GitHub release. The derive and
# internal crates are published in lockstep but get no tags/releases/changelog
# of their own — three packages rendering the same "v{{ version }}" tag name
# would collide.
changelog_update = false
git_tag_enable = false
git_release_enable = false

# All three crates are versioned and released in lockstep. Note: members of a
# version_group with no changes of their own only re-release when a path-dep
# member bumps — with the workspace's version + path dependencies, the facade
# always follows the derive crate and the internal shim always follows the
# facade, which is the desired behavior.
[[package]]
name = "struct_iterable"
version_group = "main"
changelog_update = true
changelog_path = "CHANGELOG.md"
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"

[[package]]
name = "struct_iterable_derive"
version_group = "main"

[[package]]
name = "struct_iterable_internal"
version_group = "main"
