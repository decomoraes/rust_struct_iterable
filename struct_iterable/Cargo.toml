[package]
name = "struct_iterable"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A Rust library providing a proc macro to make a struct iterable."
readme = "README.md"
keywords = ["derive", "iterate", "struct", "fields", "reflection"]
categories = ["rust-patterns", "development-tools::procedural-macro-helpers"]
homepage = "https://github.com/decomoraes/rust_struct_iterable"
documentation = "https://docs.rs/struct_iterable"
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
struct_iterable_derive.workspace = true
struct_iterable_internal.workspace = true

[dev-dependencies]
trybuild = { version = "1.0", features = ["diff"] }
macrotest = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
