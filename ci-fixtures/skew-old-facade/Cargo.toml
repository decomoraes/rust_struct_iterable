# Compile-only CI fixture. Proves version skew safety: the PUBLISHED facade
# struct_iterable 0.1.1 (from crates.io) combined with the LOCAL derive and
# internal crates. Because the facade depends on the derive with a caret
# requirement, a new derive release flows automatically to existing 0.1.x
# facade users — the code the derive generates (`impl ::struct_iterable::
# Iterable ...`) must therefore keep resolving against facade 0.1.1.
#
# Deliberately not a workspace member (see `exclude` in the root Cargo.toml).

[package]
name = "skew-old-facade"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
struct_iterable = "=0.1.1"

[patch.crates-io]
struct_iterable_derive = { path = "../../struct_iterable_derive" }
struct_iterable_internal = { path = "../../struct_iterable_internal" }
