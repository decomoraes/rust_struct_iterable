[workspace]
resolver = "2"
members = [
    "struct_iterable",
    "struct_iterable_derive",
    "struct_iterable_internal",
]

[workspace.package]
edition = "2021"
rust-version = "1.71"
authors = ["André de Moraes <deco.moraes@icloud.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/decomoraes/rust_struct_iterable"

[workspace.dependencies]
struct_iterable_derive = { version = "=0.1.2", path = "struct_iterable_derive" }
struct_iterable_internal = { version = "0.1.1", path = "struct_iterable_internal" }
syn = { version = "2.0.13", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
quote = "1.0.26"
proc-macro2 = "1.0.56"
