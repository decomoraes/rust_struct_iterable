[workspace]
resolver = "2"
members = [
    "struct_iterable",
    "struct_iterable_derive",
    "struct_iterable_internal",
]
# Compile-only compatibility fixtures built by CI against the published
# crates; deliberately not workspace members.
exclude = ["ci-fixtures"]

[workspace.package]
edition = "2021"
rust-version = "1.71"
authors = ["André de Moraes <deco.moraes@icloud.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/decomoraes/rust_struct_iterable"

[workspace.dependencies]
struct_iterable_derive = { version = "=0.2.0", path = "struct_iterable_derive" }
syn = { version = "2.0.13", default-features = false, features = ["derive", "parsing", "printing", "proc-macro", "clone-impls"] }
quote = "1.0.35"
proc-macro2 = "1.0.80"
