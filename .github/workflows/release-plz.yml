# Publishing is opt-in twice over: the release job only runs when the
# repository variable RELEASE_PLZ_ENABLED is set to "true" (Settings ->
# Secrets and variables -> Actions -> Variables), and it also needs the
# CARGO_REGISTRY_TOKEN secret. Until both exist, pushes to main only
# open/update the release PR. Manual fallback documented in CONTRIBUTING.
name: Release-plz

on:
  push:
    branches: [main]

permissions:
  pull-requests: write
  contents: write

jobs:
  release-plz-release:
    name: release
    runs-on: ubuntu-latest
    if: vars.RELEASE_PLZ_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scoped crates.io token: publish-update only. Migrate to crates.io
          # Trusted Publishing (OIDC) once configured — preferred, tokenless.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: release-pr
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
